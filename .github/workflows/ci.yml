name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run CP1-CP4 tests
        env:
          AGENT_API_KEY: ci-dummy-key
          REDIS_URL: fake://
        run: >-
          python -m pytest
          tests/test_cp1.py
          tests/test_cp2.py
          tests/test_cp3.py
          tests/test_cp4.py
          -m "not docker"

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag day12-agent:${{ github.sha }} .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.RENDER_DEPLOY_ENABLED == 'true'
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "Missing RENDER_DEPLOY_HOOK_URL secret"; exit 1; }
          test -n "$PUBLIC_URL" || { echo "Missing PUBLIC_URL repository variable"; exit 1; }

      - name: Trigger Render deployment
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Smoke test deployed service
        shell: bash
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error "$PUBLIC_URL/health"; then
              exit 0
            fi
            echo "Service is not ready yet (attempt $attempt/18)"
            sleep 10
          done
          exit 1
